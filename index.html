<!doctype html>
<!--
  Pixel Invaders - shell page (canvas + settings panel)
  Created by Stephane Plaisance
  Co-authored by Claude (Anthropic)
  Version 1.1.0 - 2026-07-05
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Invaders — Stephane Plaisance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      color: #33ff33;
      font-family: "Courier New", ui-monospace, monospace;
      overflow: hidden;
    }
    #stage {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#screen {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
    }
    #gear {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 20;
      background: #111;
      color: #33ff33;
      border: 1px solid #33ff33;
      font-size: 18px;
      line-height: 1;
      padding: 6px 9px;
      cursor: pointer;
    }
    #gear:hover { background: #1d2a1d; }

    /* ---- settings panel drawer ---- */
    #panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 320px;
      max-width: 90vw;
      background: #0b0f0b;
      border-left: 1px solid #33ff33;
      transform: translateX(100%);
      transition: transform 0.15s ease-out;
      z-index: 30;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }
    #panel.open { transform: translateX(0); }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #234023;
      letter-spacing: 2px;
    }
    .panel-close {
      background: none;
      border: 1px solid #33ff33;
      color: #33ff33;
      cursor: pointer;
      padding: 2px 8px;
    }
    .panel-body {
      overflow-y: auto;
      padding: 6px 12px 20px;
      flex: 1;
    }
    .panel-section {
      margin: 14px 0 4px;
      color: #7fff7f;
      letter-spacing: 2px;
      border-bottom: 1px dashed #234023;
      padding-bottom: 2px;
      min-height: 8px;
    }
    .panel-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 2px 8px;
      padding: 4px 0;
    }
    .panel-label { grid-column: 1 / -1; color: #bfe8bf; }
    .panel-row input[type="range"] { width: 100%; accent-color: #33ff33; }
    .panel-row input[type="checkbox"] { accent-color: #33ff33; justify-self: start; }
    .panel-row select {
      grid-column: 1 / -1;
      background: #111;
      color: #33ff33;
      border: 1px solid #234023;
      padding: 3px;
    }
    .panel-value { color: #33ff33; min-width: 64px; text-align: right; }
    .panel-keys .panel-keyslots {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
    }
    .panel-keybtn {
      background: #111;
      border: 1px solid #33ff33;
      color: #33ff33;
      padding: 3px 10px;
      cursor: pointer;
      min-width: 64px;
    }
    .panel-keybtn.capturing { background: #234023; }
    .panel-keyclear {
      background: none;
      border: 1px solid #612;
      color: #f66;
      cursor: pointer;
      padding: 3px 6px;
    }
    .panel-reset {
      width: 100%;
      margin-top: 14px;
      background: #1a0d0d;
      border: 1px solid #f66;
      color: #f66;
      padding: 8px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .panel-note { color: #6a8f6a; font-size: 11px; margin: 6px 0; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="224" height="256"></canvas>
  </div>
  <button id="gear" title="Settings (C)">⚙</button>
  <aside id="panel" aria-label="Settings"></aside>
  <script type="module" src="src/main.js"></script>
</body>
</html>
